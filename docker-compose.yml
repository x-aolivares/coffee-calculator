services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Publicado en todas las interfaces; acceso directo por IP de Tailscale.
      - "0.0.0.0:4321:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
